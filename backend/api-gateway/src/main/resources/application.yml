server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
              - "${CORS_ALLOWED_ORIGIN:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # Auth Service: /api/auth/** -> auth-service:8081/api/auth/**
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        # Public Registration: /api/users/register -> user-service:8082
        - id: user-registration
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/users/register

        # User Service: /api/users/** -> user-service:8082
        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/users/**
          filters:
            - Jwt

        # Post Service: /api/posts/** -> post-service:8083
        - id: post-service
          uri: ${POST_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/posts/**
          filters:
            - Jwt
            - StripPrefix=1

        # Job Service: /api/jobs/** -> job-service:8084
        - id: job-service
          uri: ${JOB_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/jobs/**
          filters:
            - Jwt

        # Event Service: /api/events/** -> event-service:8085
        - id: event-service
          uri: ${EVENT_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/events/**
          filters:
            - Jwt

        # Notification Service: /api/notifications/** -> notification-service:8088
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/notifications/**
          filters:
            - Jwt

        # Messaging Service WebSocket: /ws/** -> messaging-service:8087
        - id: messaging-service-ws
          uri: ${MESSAGING_SERVICE_WS_URI:ws://localhost:8087}
          predicates:
            - Path=/ws/**

        # Messaging Service REST: /api/conversations/** -> messaging-service:8087
        - id: messaging-service
          uri: ${MESSAGING_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/conversations/**
          filters:
            - Jwt

        # Research Service: /api/research/** -> research-service:8086
        - id: research-service
          uri: ${RESEARCH_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/research/**
          filters:
            - Jwt

        # Analytics Service: /api/analytics/** -> analytics-service:8090
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/analytics/**
          filters:
            - Jwt

        # Mentorship Service: /api/mentorship/** -> mentorship-service:8089
        - id: mentorship-service
          uri: ${MENTORSHIP_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/mentorship/**
          filters:
            - Jwt
            - RewritePath=/api/mentorship(?<segment>/?.*), /api/mentorship$\{segment}

management:
  endpoints:
    web:
      exposure:
        include: "*"

jwt:
  secret: ${JWT_SECRET:your-very-secure-and-long-secret-key-for-decp-project}
